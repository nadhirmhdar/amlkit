<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" fill="none">
  <defs>
    <radialGradient id="heroGlow" cx="46%" cy="30%" r="70%">
      <stop offset="0%" stop-color="oklch(52% 0.15 250 / 0.38)"/>
      <stop offset="100%" stop-color="oklch(52% 0.15 250 / 0)"/>
    </radialGradient>
    <clipPath id="heroClip"><rect width="560" height="320" rx="28"/></clipPath>
  </defs>

  <rect width="560" height="320" rx="28" fill="oklch(19% 0.012 250)"/>
  <rect width="560" height="320" rx="28" fill="url(#heroGlow)"/>

  <g clip-path="url(#heroClip)">

    <!-- ===== order-side texture: faint dot grid ===== -->
    <g fill="oklch(100% 0 0 / 0.05)">
      <circle cx="330" cy="46" r="1.6"/><circle cx="366" cy="46" r="1.6"/><circle cx="402" cy="46" r="1.6"/><circle cx="438" cy="46" r="1.6"/><circle cx="474" cy="46" r="1.6"/><circle cx="510" cy="46" r="1.6"/>
      <circle cx="330" cy="274" r="1.6"/><circle cx="366" cy="274" r="1.6"/><circle cx="402" cy="274" r="1.6"/><circle cx="438" cy="274" r="1.6"/><circle cx="474" cy="274" r="1.6"/><circle cx="510" cy="274" r="1.6"/>
    </g>

    <!-- ===== chaos zone (left): tangled sanctions-risk mess ===== -->
    <g stroke-linecap="round" fill="none">
      <path d="M32,88 C74,46 56,142 112,116 C158,94 122,192 172,158" stroke="oklch(53% 0.16 25)" stroke-width="2.75" opacity="0.9"/>
      <path d="M26,206 C68,248 46,158 104,196 C146,224 116,138 168,168" stroke="oklch(62% 0.13 70)" stroke-width="2.75" opacity="0.9"/>
      <path d="M46,258 C84,232 60,290 118,266" stroke="oklch(53% 0.16 25)" stroke-width="2.25" opacity="0.55"/>
      <path d="M40,50 C60,70 30,78 58,96" stroke="oklch(62% 0.13 70)" stroke-width="2.25" opacity="0.55"/>
    </g>

    <!-- scattered alert flecks -->
    <g stroke="oklch(53% 0.16 25)" stroke-width="2.4" stroke-linecap="round">
      <line x1="140" y1="60" x2="140" y2="72"/><circle cx="140" cy="80" r="1.7" fill="oklch(53% 0.16 25)" stroke="none"/>
    </g>
    <g stroke="oklch(62% 0.13 70)" stroke-width="2.4" stroke-linecap="round">
      <line x1="70" y1="150" x2="70" y2="162" transform="rotate(-12 70 156)"/><circle cx="67" cy="169" r="1.7" fill="oklch(62% 0.13 70)" stroke="none"/>
    </g>
    <g stroke="oklch(53% 0.16 25)" stroke-width="2.2" stroke-linecap="round">
      <line x1="150" y1="222" x2="150" y2="233" transform="rotate(10 150 227)"/><circle cx="153" cy="240" r="1.6" fill="oklch(53% 0.16 25)" stroke="none"/>
    </g>

    <!-- scattered loose document outlines -->
    <g stroke="oklch(100% 0 0 / 0.22)" stroke-width="1.6">
      <rect x="20" y="118" width="34" height="44" rx="4" transform="rotate(-14 37 140)"/>
      <rect x="150" y="90" width="30" height="40" rx="4" transform="rotate(9 165 110)"/>
      <rect x="90" y="228" width="30" height="40" rx="4" transform="rotate(-7 105 248)"/>
    </g>

    <!-- ===== the gate: amlkit ===== -->
    <g>
      <rect x="194" y="52" width="66" height="216" rx="33" fill="oklch(52% 0.15 250)"/>
      <!-- shield + check mark -->
      <g transform="translate(227,124)" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M0,-16 L14,-10 V4 C14,16 7,24 0,28 C-7,24 -14,16 -14,4 V-10 Z"/>
        <path d="M-6,4 L-1,10 L8,-4"/>
      </g>
      <!-- vertical wordmark -->
      <text x="227" y="205" fill="white" fill-opacity="0.92" font-family="Manrope, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5" text-anchor="middle" writing-mode="vertical-rl" transform="rotate(180 227 205)">amlkit</text>
    </g>

    <!-- ===== order zone (right): one clean streamlined line ===== -->
    <path d="M262,160 C300,160 300,70 400,70 M262,160 C300,160 300,148 400,148 M262,160 C300,160 300,212 400,212"
          stroke="oklch(52% 0.15 250 / 0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M262,160 C300,160 300,160 400,160"
          stroke="oklch(52% 0.15 250)" stroke-width="2.75" fill="none" stroke-linecap="round"/>

    <!-- three orderly file chips -->
    <g font-family="Manrope, sans-serif">
      <g transform="translate(400,49)">
        <rect width="118" height="42" rx="10" fill="oklch(100% 0 0 / 0.06)" stroke="oklch(100% 0 0 / 0.14)"/>
        <circle cx="21" cy="21" r="10" fill="oklch(52% 0.15 250 / 0.18)"/>
        <path d="M16,21 L19.5,25 L27,15" stroke="oklch(70% 0.13 250)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="40" y="15" width="60" height="4.5" rx="2.25" fill="oklch(100% 0 0 / 0.3)"/>
        <rect x="40" y="24" width="40" height="4.5" rx="2.25" fill="oklch(100% 0 0 / 0.16)"/>
      </g>
      <g transform="translate(400,139)">
        <rect width="118" height="42" rx="10" fill="oklch(100% 0 0 / 0.06)" stroke="oklch(100% 0 0 / 0.14)"/>
        <circle cx="21" cy="21" r="10" fill="oklch(52% 0.15 250 / 0.18)"/>
        <path d="M16,21 L19.5,25 L27,15" stroke="oklch(70% 0.13 250)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="40" y="15" width="66" height="4.5" rx="2.25" fill="oklch(100% 0 0 / 0.3)"/>
        <rect x="40" y="24" width="34" height="4.5" rx="2.25" fill="oklch(100% 0 0 / 0.16)"/>
      </g>
      <g transform="translate(400,201)">
        <rect width="118" height="42" rx="10" fill="oklch(100% 0 0 / 0.06)" stroke="oklch(100% 0 0 / 0.14)"/>
        <circle cx="21" cy="21" r="10" fill="oklch(52% 0.15 250 / 0.18)"/>
        <path d="M16,21 L19.5,25 L27,15" stroke="oklch(70% 0.13 250)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="40" y="15" width="52" height="4.5" rx="2.25" fill="oklch(100% 0 0 / 0.3)"/>
        <rect x="40" y="24" width="46" height="4.5" rx="2.25" fill="oklch(100% 0 0 / 0.16)"/>
      </g>
    </g>

    <!-- connector ticks from spine to each chip -->
    <g stroke="oklch(52% 0.15 250 / 0.5)" stroke-width="1.6">
      <line x1="400" y1="70" x2="400" y2="70"/>
    </g>
  </g>
</svg>
