{% extends "base.html" %}
{% block title %}Change Password — amlkit{% endblock %}
{% block body %}

<div class="page-header">
  <h1>Change Password</h1>
</div>

<div class="form-container" style="max-width:480px;">
  <form method="post" action="/account/password" style="display:flex; flex-direction:column; gap:20px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="field">
      <label>Current Password</label>
      <input type="password" name="current_password" autocomplete="current-password" required>
    </div>

    <div class="field">
      <label>New Password</label>
      <input type="password" name="new_password" autocomplete="new-password" required>
    </div>

    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </div>

    <div style="display:flex; gap:12px;">
      <button type="submit" class="btn-glow">Change Password</button>
      <a href="/" class="btn" style="text-decoration:none; display:inline-flex; align-items:center;">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
