{% extends "base.html" %}
{% block title %}Sign in — Grovisor amlkit{% endblock %}
{% block body %}

<div class="panel" style="max-width:420px;margin:40px auto">
  <h2>Sign in</h2>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label>Email</label>
      <input type="text" name="email" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" style="width:100%">Sign in</button>
  </form>
  <p class="muted small" style="margin-top:16px;margin-bottom:0">
    New organization? <a href="/register-organization">Register one</a>.
  </p>
</div>

{% endblock %}
