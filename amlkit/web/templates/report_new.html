{% extends "base.html" %}
{% set nav = 'reports' %}
{% block title %}New Regulatory Report — amlkit{% endblock %}
{% block body %}

<div class="page-head">
  <div class="eyebrow">Compliance</div>
  <h1>New report draft</h1>
  <p class="sub">Select the subject customer and the type of report you wish to compile.</p>
</div>

<div style="max-width:520px;">
  <form method="get" action="/reports/build">
    <div class="field">
      <label>Subject customer</label>
      <select name="customer_id" required>
        <option value="">— Select customer —</option>
        {% for c in customers %}
          <option value="{{ c.id }}">{{ c.reference }} — {{ c.full_name }} ({{ c.status }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>goAML report type</label>
      <select name="report_type" required>
        <option value="STR">STR — Suspicious Transaction Report</option>
        <option value="SAR">SAR — Suspicious Activity Report</option>
        <option value="PNMR">PNMR — Partial Name Match Report</option>
        <option value="FFR">FFR — Fund Freeze Report</option>
        <option value="HRCT">HRCT — High Risk Country Transaction Report</option>
        <option value="HRCA">HRCA — High Risk Country Activity Report</option>
        <option value="DPMSR">DPMSR — Dealers in Precious Metals and Stones Report</option>
        <option value="REAR">REAR — Real Estate Activity Report</option>
      </select>
    </div>
    <div class="mt-6">
      <button type="submit">Begin draft builder</button>
      <a class="btn ghost" href="/reports">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
