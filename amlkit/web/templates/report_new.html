{% extends "base.html" %}
{% set nav = 'reports' %}
{% block title %}New Regulatory Report — groAML{% endblock %}
{% block body %}

<div class="page-head">
  <div class="eyebrow">Compliance</div>
  <h1>New report draft</h1>
  <p class="sub">Select the subject customer and the type of report you wish to compile.</p>
</div>

<div style="max-width:520px;">
  <form method="get" action="/reports/build">
    <div class="field">
      <label>Subject customer</label>
      <select name="customer_id" required>
        <option value="">— Select customer —</option>
        {% for c in customers %}
          <option value="{{ c.id }}">{{ c.reference }} — {{ c.full_name }} ({{ c.status }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>goAML report type</label>
      <select name="report_type" required>
        {% for code, label in report_types %}
          <option value="{{ code }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mt-6">
      <button type="submit">Begin draft builder</button>
      <a class="btn ghost" href="/reports">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
