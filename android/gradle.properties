# AndroidX is required by every androidx.* dependency this app uses (Compose,
# navigation, lifecycle, security-crypto) -- without this, AGP refuses to
# build once it sees an AndroidX artifact on the classpath.
android.useAndroidX=true

# Each module gets its own R class scoped to its own resources instead of one
# giant transitive R spanning every dependency -- faster incremental builds,
# and this app is a single :app module so there's no cross-module resource
# sharing to lose by turning it on.
android.nonTransitiveRClass=true

# Gradle daemon + parallel module builds + on-demand configuration: CI-only
# project, so the extra memory/startup cost of a persistent daemon buys
# nothing there, but the flags are harmless (this is a single-module build,
# so "parallel" has nothing to parallelize yet) and are what a real developer
# would also want running this locally.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
