# Upstream source canary.
#
# This workflow is NOT the 24-hour compliance control. Customer data lives on
# the compliance officer's machine and never reaches CI, so there is nothing
# here to re-screen -- see scripts/refresh.py, which is the actual control.
#
# What this does is catch upstream breakage early: a renamed dataset, a changed
# export format, a truncated file. Those failures are silent by nature -- the
# local refresh would keep reporting success against a stale copy -- so finding
# them here, on a schedule, is worth a job on its own.

name: Source canary

on:
  schedule:
    - cron: "0 5 * * *"      # daily, 05:00 UTC (09:00 Gulf Standard Time)
  workflow_dispatch:
    inputs:
      # One-boot replica reseed (entrypoint.sh AMLKIT_SEED_*): only honoured
      # when LITESTREAM_REPLICA_URL has no replica yet. Leave both empty for
      # an ordinary manual redeploy. A later deploy (push or dispatch without
      # them) drops the variables again.
      seed_from_url:
        description: "Reseed: source replica URL (gs://...) to restore when LITESTREAM_REPLICA_URL is empty"
        required: false
        default: ""
      seed_txid:
        description: "Reseed: TXID in the source to restore to (16 hex digits); empty = its head"
        required: false
        default: ""
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 / setup-python@v6 are the first majors targeting Node 24.
      # v4/v5 target Node 20, which GitHub deprecated: the runner force-upgrades
      # them and warns on every run. Pinning the current majors keeps the
      # canary's output meaningful -- a workflow whose job is detecting silent
      # breakage must not itself be noisy, or real warnings get skimmed past.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # The `graphviz` PyPI package (in requirements.txt) is only a thin
      # subprocess wrapper around the real `dot` binary -- tests/test_diagram.py
      # actually renders an SVG via dot.pipe(), which needs it on PATH.
      # ubuntu-latest doesn't ship it by default.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
        # Hermetic: the suite builds its own in-memory watchlist and needs no
        # network, so a failure here is a real regression, not a flaky source.

  sources:
    name: Verify upstream sources
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 / setup-python@v6 are the first majors targeting Node 24.
      # v4/v5 target Node 20, which GitHub deprecated: the runner force-upgrades
      # them and warns on every run. Pinning the current majors keeps the
      # canary's output meaningful -- a workflow whose job is detecting silent
      # breakage must not itself be noisy, or real warnings get skimmed past.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch and parse every source
        run: |
          python - <<'PY'
          import sys
          from amlkit.db import connect
          from amlkit.ingest.base import AdapterError
          from amlkit.ingest.loader import load

          # WHICH sources to check comes from ONE place: scripts/heartbeat.py's
          # ALL_SOURCES. This job used to re-list the adapters inline and had
          # already drifted from that list -- it hardcoded five and omitted EU,
          # so EU drift would never have shown up here, the exact silent
          # coverage loss this canary exists to catch. Importing the shared
          # list makes that drift structurally impossible: add a source in one
          # place and both the heartbeat and this canary pick it up.
          #
          # This canary still does MORE than the heartbeat: it not only
          # fetch()es but parse()s and enforces a per-source minimum
          # entity-count floor, catching a source that changed format and
          # shrank rather than one that went fully offline.
          from scripts.heartbeat import ALL_SOURCES

          # Expected minimum entity counts, keyed by dataset. A source that
          # suddenly returns far fewer records has usually changed format
          # rather than been emptied; for a mandatory source that must fail
          # rather than quietly shrink coverage.
          EXPECTED = {
              "ae_local_terrorists": 250,
              "un_consolidated": 700,
              "ofac_sdn": 12000,
              "uk_sanctions": 4000,
              "us_cia_world_leaders": 4000,
              "eu_sanctions": 2000,
              # Conservative floor -- ~195 countries' current cabinet
              # ministers should be in the low thousands on Wikidata, but
              # this is a new, non-mandatory source with no observed
              # production count yet. Catches a collapse to near-zero
              # (broken SPARQL query/endpoint) without over-fitting to an
              # exact number; tighten once real counts are observed.
              "wikidata_ministers": 300,
          }

          conn = connect(":memory:")
          failed = []   # mandatory problems -> fail the build
          warned = []   # optional/degradable problems -> warn only, never block
          # Blocking is decided per-adapter by is_mandatory (the adapter is the
          # single source of truth for that too), NOT by a second hardcoded
          # list here. EU is the one non-mandatory sanctions source (its FSF
          # token can be rotated/rate-limited without notice -- see README), so
          # a EU failure degrades coverage rather than blocking a deploy; the
          # adverse-media step below treats GDELT the same non-blocking way.
          for factory in ALL_SOURCES:
              adapter = factory()
              mandatory = adapter.is_mandatory
              try:
                  res = load(conn, adapter, actor="ci")
                  floor = EXPECTED.get(res.dataset, 1)
                  if res.entities < floor:
                      msg = f"{res.dataset}: {res.entities} entities, expected >= {floor}"
                      if mandatory:
                          failed.append(msg)
                          print(f"::error::{res.dataset} returned only {res.entities} entities")
                      else:
                          warned.append(msg)
                          print(f"::warning::{res.dataset} returned only {res.entities} "
                                f"entities (optional source; not blocking)")
                  else:
                      print(f"OK  {res}")
              except AdapterError as exc:
                  msg = f"{adapter.key}: {exc}"
                  if mandatory:
                      failed.append(msg)
                      print(f"::error::{adapter.key} failed: {exc}")
                  else:
                      warned.append(msg)
                      print(f"::warning::{adapter.key} failed (optional source; "
                            f"not blocking): {exc}")

          if warned:
              print("\nOPTIONAL SOURCE DEGRADATION (not blocking):")
              for w in warned:
                  print(f"  - {w}")
          if failed:
              print("\nUPSTREAM SOURCE FAILURE:")
              for f in failed:
                  print(f"  - {f}")
              sys.exit(1)
          print("\nAll mandatory sources fetched and parsed.")
          PY

      # Adverse media (GDELT) is checked separately and NEVER fails this job.
      #
      # Two reasons, both deliberate. It is not a mandatory source -- the
      # sanctions lists above are a legal obligation, negative news is a
      # risk-based input, and screening/adverse_media.py already treats a
      # GDELT outage as a recorded degradation rather than a blocker. Failing
      # the build here would contradict that and, worse, would let a free
      # public API's hiccup block a deploy of the sanctions screening that
      # actually is mandatory.
      #
      # It still earns its place: what this catches is SCHEMA DRIFT. If GDELT
      # renames a field, parse_articles() starts returning empty findings and
      # every adverse-media check silently reports "clear" -- the exact
      # silent-coverage-loss failure this whole workflow exists to detect.
      #
      # Schedule/dispatch only, not on every PR push: GDELT rate-limits to one
      # request per 5s per source IP and GitHub runners share addresses, so
      # hammering it on every commit would be both rude and self-defeating.
      - name: Smoke-test the adverse media provider (non-blocking)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python - <<'PY'
          from amlkit.screening.adverse_media import (
              GDELTClient, MediaUnavailable, classify, parse_articles,
          )

          # A generic high-volume term rather than a real person's name: this
          # is checking that GDELT answers and that its artlist JSON still has
          # the fields parse_articles() reads. Naming an individual in a CI
          # file to prove a news API works would be gratuitous in an AML tool.
          try:
              payload = GDELTClient().fetch("fraud", window_months=1, max_records=10)
          except MediaUnavailable as exc:
              print(f"::warning::GDELT unavailable: {exc}")
              print("Adverse media screening degrades gracefully; sanctions "
                    "screening is unaffected.")
              raise SystemExit(0)

          articles = parse_articles(payload)
          if not articles:
              print("::warning::GDELT answered but no articles parsed -- check "
                    "whether the artlist field names have changed "
                    "(url/title/domain/language/sourcecountry/seendate).")
              raise SystemExit(0)

          # Field-level check: a renamed field shows up as every article
          # carrying an empty value, which parse_articles tolerates by design.
          # Tolerating it is right at runtime and wrong to stay quiet about here.
          missing = [
              name for name, present in (
                  ("title", any(a.title for a in articles)),
                  ("domain", any(a.domain for a in articles)),
                  ("seendate", any(a.published_at for a in articles)),
              ) if not present
          ]
          if missing:
              print(f"::warning::GDELT returned articles but these fields were "
                    f"empty across all of them: {', '.join(missing)}. Likely a "
                    f"renamed field in the artlist response.")

          adverse = sum(1 for a in articles if classify(a.title)[0] != "none")
          print(f"OK  GDELT: {len(articles)} articles parsed, "
                f"{adverse} classified adverse.")
          PY

  heartbeat:
    name: Source connectivity heartbeat
    runs-on: ubuntu-latest
    # A deliberately lightweight counterpart to the `sources` job above: it
    # only fetch()es each source (no parse, no entity-count floors), so it is
    # cheap enough to run as a fast connectivity smoke test. It iterates the
    # SAME shared list -- scripts/heartbeat.py's ALL_SOURCES -- as the canary,
    # which is the whole point: one authoritative source list, exercised by
    # both, so neither can silently drop a source. Mandatory-source failure
    # exits 1 and fails this job; optional sources (EU) only warn, matching the
    # canary. Wiring the script into CI means it can no longer rot unnoticed.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run connectivity heartbeat
        run: python scripts/heartbeat.py

  # Back-to-back merges each start a run, and test time varies, so an older
  # commit's deploy could finish after a newer one's and roll production back
  # (image and env vars). This gate skips the deploy when master has already
  # moved past this commit -- the newer run deploys instead. Paired with the
  # deploy job's concurrency group below, which stops two deploys overlapping.
  deploy-gate:
    name: Check commit is still master head
    needs: [tests, sources]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
          if [ "$HEAD_SHA" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "master is at $HEAD_SHA, not ${{ github.sha }} -- skipping deploy; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Cloud Run
    needs: [tests, sources, deploy-gate]
    # workflow_dispatch alongside push: lets a manual run re-deploy master
    # on demand (e.g. to verify an IAM change like scripts/grant_scheduler_
    # iam.sh took effect) without needing a throwaway commit to trigger it.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deploy-gate.outputs.current == 'true'
    # One deploy at a time. cancel-in-progress: false -- never kill a deploy
    # mid-rollout; a newer queued run waits and then deploys on top.
    concurrency:
      group: cloud-run-deploy-amlkit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Workload Identity Federation: GitHub's own OIDC token is exchanged
      # for short-lived GCP credentials. No service-account key ever exists
      # anywhere -- see scripts/setup_github_deploy_auth.sh for the one-time
      # GCP-side setup this depends on.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 'gcloud builds submit' was tried here first and never worked under WIF:
      # it uploads the build source through a gsutil-backed path that, per a
      # confirmed (Google "closed as not planned") upstream report, does not
      # correctly consume Workload Identity Federation credentials -- it
      # produces "The user is forbidden from accessing the bucket [..._cloudbuild]"
      # regardless of how correct the service account's IAM grants are, because
      # that upload step silently isn't using them. Three different IAM fixes
      # (objectAdmin, serviceUsageConsumer, storage.admin -- all confirmed
      # correctly applied) made no difference, which is what exposed this as a
      # client bug rather than a permissions gap. Building with Docker Buildx
      # and pushing straight to Artifact Registry avoids that upload path
      # entirely -- 'docker push' authenticates through the same WIF credential
      # via 'gcloud auth configure-docker', which is NOT affected by the bug.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build --push \
            -t "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/amlkit/amlkit:${{ github.sha }}" \
            .

      # SCHEDULER_SECRET / ADMIN_API_SECRET gate the /system/* endpoints (see
      # app.py). Reuse whatever is already deployed rather than regenerating
      # on every deploy -- `gcloud run deploy --set-env-vars` REPLACES the
      # entire env var set, so a naive redeploy would otherwise silently
      # rotate these out from under Cloud Scheduler's existing job. This step,
      # and the Cloud Scheduler wiring after deploy, port what the old manual
      # deploy scripts (removed -- they were still on a gcr.io/gcloud builds
      # submit path this CI moved off of) did by hand -- switching to this CI
      # deploy path (see the "Build and push image" step above) dropped both,
      # which is why the /system/refresh Cloud Scheduler path silently
      # stopped working: the endpoint has been returning 403 (SCHEDULER_SECRET
      # unset) on every deploy since.
      - name: Resolve scheduler/admin secrets
        run: |
          # Was previously a `grep -oE "$1=[^,}]+"` against --format=value(...),
          # which asks gcloud to stringify the env list as a Python-repr-ish
          # blob (each entry shaped like {'name': 'X', 'value': 'Y'}, not
          # X=Y) -- a KEY=VALUE regex can never match that shape, so
          # extract_existing silently returned empty on every single deploy,
          # meaning these two secrets were being freshly regenerated every
          # time rather than actually preserved as the comment above claims.
          # That's exactly why Cloud Scheduler's stored Authorization header
          # kept going stale against whatever SCHEDULER_SECRET the *next*
          # deploy happened to mint. --format=json + jq (preinstalled on
          # ubuntu-latest) parses the real structure instead of guessing at
          # gcloud's text rendering of it.
          EXISTING_ENV_JSON=$(gcloud run services describe amlkit --platform managed \
            --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
            --format "json(spec.template.spec.containers[0].env)" 2>/dev/null || echo "{}")
          extract_existing() {
            echo "$EXISTING_ENV_JSON" | jq -r --arg name "$1" \
              '(.spec.template.spec.containers[0].env // [])
               | map(select(.name == $name)) | .[0].value // empty'
          }
          SCHEDULER_SECRET=$(extract_existing SCHEDULER_SECRET)
          [ -z "$SCHEDULER_SECRET" ] && SCHEDULER_SECRET=$(openssl rand -hex 24)
          ADMIN_API_SECRET=$(extract_existing ADMIN_API_SECRET)
          [ -z "$ADMIN_API_SECRET" ] && ADMIN_API_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$SCHEDULER_SECRET"
          echo "::add-mask::$ADMIN_API_SECRET"
          echo "SCHEDULER_SECRET=$SCHEDULER_SECRET" >> "$GITHUB_ENV"
          echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> "$GITHUB_ENV"

      # AMLKIT_APP_BASE_URL was never set at all, so mail.py's
      # send_verification_email() fell back to its http://127.0.0.1:8000
      # default on every registration -- the emailed link pointed at the
      # recipient's own machine instead of the deployed service, making
      # every verification link sent so far unusable. The service's own URL
      # is stable across revisions once it exists (Cloud Run doesn't change
      # it on redeploy), so this reads it back from the current service the
      # same way "Report deployed URL" does after deploying, rather than
      # hardcoding it -- a one-time manual `gcloud run services describe`
      # on first deploy for a not-yet-existing service would need a
      # different bootstrap anyway.
      # The repo variable APP_BASE_URL overrides this with the public custom
      # domain (https://groaml.grovisor.ae, served by the global HTTPS load
      # balancer in front of this service) so emailed links don't point at
      # the raw *.run.app URL. Unset = fall back to the service URL as before.
      - name: Resolve app base URL
        env:
          APP_BASE_URL_OVERRIDE: ${{ vars.APP_BASE_URL }}
        run: |
          APP_BASE_URL="$APP_BASE_URL_OVERRIDE"
          if [ -z "$APP_BASE_URL" ]; then
            APP_BASE_URL=$(gcloud run services describe amlkit --platform managed \
              --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --format "value(status.url)" 2>/dev/null || true)
          fi
          echo "APP_BASE_URL=${APP_BASE_URL%/}" >> "$GITHUB_ENV"

      # Same shape as the old (removed) manual deploy scripts, tagged by
      # commit SHA so every deploy is traceable to the exact commit that
      # produced it. --timeout 900: /system/refresh runs the sanctions refresh
      # synchronously, so the request needs to be allowed to run long enough.
      # --max-instances 1: Litestream supports exactly ONE writer per replica.
      # With 10, concurrent instances interleaved two WAL histories into the
      # same replica and corrupted it (2026-09-27 outage). A rollout can still
      # overlap old and new revisions briefly; that needs a proper lease/lock.
      # --min-instances 1 (was 0, for $0 idle cost): a cold start restores
      # the database from the litestream replica, which replays every LTX
      # file since the last snapshot. (Snapshots run on an absolute grid of
      # snapshot.interval plus one attempt at startup -- not, as this comment
      # used to say, only after that much continuous uptime; see the
      # Correction in docs/incidents/2026-10-04-groaml-cold-start-outage.md.)
      # By 2026-10-04 the replay had outgrown
      # Cloud Run's default 240s TCP startup probe, so every request after an
      # idle period waited on a cold start that was killed at 240s and came
      # back 503/429 while the last deploy (which had booted in time) sat
      # idle. One warm instance means operators never hit the restore path
      # (only deploys do), and the single-writer rule above still holds.
      # The app also runs `litestream sync -wait` after its critical writes
      # (AMLKIT_SYNC_REPLICA, on because LITESTREAM_REPLICA_URL is set), so
      # those reach GCS even while litestream gets little CPU between
      # requests under request-based billing.
      # --startup-probe: 600s (the Cloud Run maximum) instead of the 240s
      # default, so a deploy's own cold start survives a replay that has
      # grown between snapshots; --cpu-boost speeds up that replay.
      # --no-cpu-throttling (instance-based billing): with the default
      # request-based billing Cloud Run only allocates CPU while a request is
      # being processed, even on the --min-instances instance, so
      # `litestream replicate` -- a background process -- makes little or no
      # progress between requests. WAL written by the last request before a
      # quiet spell can sit un-uploaded until the next request arrives, and
      # is lost if Cloud Run recycles the instance first (min instances can
      # be restarted at any time). Keeping the CPU allocated closes that gap
      # for every write, not just the ones the app syncs explicitly.
      # (Not the cause of the 2026-10-04 replay growth: litestream was
      # writing L0 files all day on 3 Oct; see the incident note.)
      # Cost, me-central1 (Cloud Run Tier 2), 1 vCPU / 1 GiB around the
      # clock: roughly USD 58-63/month, against ~USD 19-21 for the same warm
      # instance billed idle under request-based billing.
      # AMLKIT_SMTP_* configure real verification-email delivery via
      # SendGrid's SMTP relay. Host/port/user are SendGrid's fixed relay
      # convention (smtp.sendgrid.net:587, username literally "apikey"), and
      # noreply@grovisor.ae is the domain already verified in Sender
      # Authentication -- none of those are secret. The password is the
      # same amlkit-prod SendGrid API key already stored as SENDGRID_API_KEY
      # (Mail Send scope) rather than duplicated into a second secret. Unlike
      # SCHEDULER_SECRET/ADMIN_API_SECRET above, none of this needs the
      # "preserve existing" dance -- these values are static, not generated
      # per-deploy, so --set-env-vars replacing the whole list each run is a
      # non-issue for them.
      - name: Deploy to Cloud Run
        env:
          AMLKIT_SMTP_HOST: smtp.sendgrid.net
          AMLKIT_SMTP_PORT: "587"
          AMLKIT_SMTP_USER: apikey
          AMLKIT_SMTP_PASSWORD: ${{ secrets.SENDGRID_API_KEY }}
          AMLKIT_SMTP_FROM: noreply@grovisor.ae
          AMLKIT_SMTP_USE_TLS: "1"
          # EU FSF token — register at https://webgate.ec.europa.eu/fsd/fsf
          # and store the issued token as repo secret EU_FSF_TOKEN. Falls back
          # to the public example token if unset, which the EC may rate-limit.
          AMLKIT_EU_FSF_TOKEN: ${{ secrets.EU_FSF_TOKEN }}
          # Gemini AI assistant — store key as repo secret GEMINI_API_KEY.
          # Unset = AI features gracefully degrade (GeminiUnavailable is caught
          # at the call site; no crash, just no AI suggestions).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Firm self-registration (/register-organization) — store the shared
          # invite code as repo secret AMLKIT_REGISTRATION_INVITE_CODE. It must
          # be passed here: --set-env-vars below replaces the service's whole
          # env list, so a value set by hand in the Cloud Run console is wiped
          # on the next deploy. Unset/empty = registration closed. Must not
          # contain ";;" (the delimiter used below).
          AMLKIT_REGISTRATION_INVITE_CODE: ${{ secrets.AMLKIT_REGISTRATION_INVITE_CODE }}
          # UAE PASS (operator SSO + customer CDD verification) — repo secrets
          # UAEPASS_CLIENT_ID / UAEPASS_CLIENT_SECRET and repo variable
          # UAEPASS_ENV (staging|production; empty = staging). Must be passed
          # here for the same reason as above (--set-env-vars replaces the
          # whole list). Either secret unset/empty = integration stays inert
          # (no button, routes 404) -- see uaepass.load_config(). Values must
          # not contain ";;".
          UAEPASS_CLIENT_ID: ${{ secrets.UAEPASS_CLIENT_ID }}
          UAEPASS_CLIENT_SECRET: ${{ secrets.UAEPASS_CLIENT_SECRET }}
          UAEPASS_ENV: ${{ vars.UAEPASS_ENV }}
          # Litestream replica location — repo variable LITESTREAM_REPLICA_URL.
          # Must be passed here for the same reason as above (--set-env-vars
          # replaces the whole list). Moved to litestream-v2/ after the
          # 2026-09-27 replica corruption; the old litestream/ prefix is corrupt
          # and must never be restored from. Required: entrypoint.sh has no
          # default and refuses to start without it, so fail here, before a
          # revision that cannot boot is rolled out.
          LITESTREAM_REPLICA_URL: ${{ vars.LITESTREAM_REPLICA_URL }}
          # One-boot reseed inputs (workflow_dispatch only; empty on push).
          AMLKIT_SEED_FROM_URL: ${{ inputs.seed_from_url }}
          AMLKIT_SEED_TXID: ${{ inputs.seed_txid }}
        run: |
          if [ -z "$LITESTREAM_REPLICA_URL" ]; then
            echo "::error::Repo variable LITESTREAM_REPLICA_URL is not set; the container would refuse to start. Set it to the production replica (litestream-v2/)."
            exit 1
          fi
          gcloud run deploy amlkit \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/amlkit/amlkit:${{ github.sha }}" \
            --platform managed \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --set-env-vars "^;;^GCS_BUCKET=${{ vars.GCS_BUCKET }};;GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }};;AMLKIT_BIND_HOST=0.0.0.0;;AMLKIT_PORT=8000;;AMLKIT_BEHIND_PROXY=1;;AMLKIT_APP_BASE_URL=${APP_BASE_URL};;SCHEDULER_SECRET=${SCHEDULER_SECRET};;ADMIN_API_SECRET=${ADMIN_API_SECRET};;AMLKIT_SMTP_HOST=${AMLKIT_SMTP_HOST};;AMLKIT_SMTP_PORT=${AMLKIT_SMTP_PORT};;AMLKIT_SMTP_USER=${AMLKIT_SMTP_USER};;AMLKIT_SMTP_PASSWORD=${AMLKIT_SMTP_PASSWORD};;AMLKIT_SMTP_FROM=${AMLKIT_SMTP_FROM};;AMLKIT_SMTP_USE_TLS=${AMLKIT_SMTP_USE_TLS};;AMLKIT_EU_FSF_TOKEN=${AMLKIT_EU_FSF_TOKEN};;GEMINI_API_KEY=${GEMINI_API_KEY};;AMLKIT_REGISTRATION_INVITE_CODE=${AMLKIT_REGISTRATION_INVITE_CODE};;LITESTREAM_REPLICA_URL=${LITESTREAM_REPLICA_URL};;UAEPASS_CLIENT_ID=${UAEPASS_CLIENT_ID};;UAEPASS_CLIENT_SECRET=${UAEPASS_CLIENT_SECRET};;UAEPASS_ENV=${UAEPASS_ENV};;AMLKIT_SEED_FROM_URL=${AMLKIT_SEED_FROM_URL};;AMLKIT_SEED_TXID=${AMLKIT_SEED_TXID}" \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 1 \
            --cpu-boost \
            --no-cpu-throttling \
            --startup-probe tcpSocket.port=8000,initialDelaySeconds=0,periodSeconds=60,failureThreshold=10,timeoutSeconds=60 \
            --timeout 900

      - name: Report deployed URL
        run: |
          URL=$(gcloud run services describe amlkit --platform managed --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --format "value(status.url)")
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "Deployed: $URL"
          echo "### Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

      # Every 20 hours: safely inside the 24-hour EOCN rule with margin for a
      # slow/retried run, same reasoning as the in-process scheduler's 23-hour
      # interval (see app.py's _lifespan) but reliable across Cloud Run
      # scaling to zero, which the in-process one is not. continue-on-error:
      # the deploy service account may not (yet) hold Cloud Scheduler IAM --
      # this step's own failure must not block a deploy that otherwise
      # succeeded; it prints exactly what's missing so it's actionable
      # instead of a silent gap.
      #
      # Deliberately does NOT run 'gcloud services enable cloudscheduler
      # .googleapis.com' here: that call requires serviceusage.services.enable
      # on every single invocation, enabled or not, and this SA is
      # intentionally scoped narrowly (see setup_github_deploy_auth.sh --
      # "no access to the app's data bucket"). Granting that broad an
      # "enable any API" permission just for a one-time project setting isn't
      # worth it. Run scripts/grant_scheduler_iam.sh once instead (enables
      # the API with your own broader access, then grants only
      # roles/cloudscheduler.admin to this SA) -- also why the bash default
      # (-e) matters here: if this were left in and failed, it would abort
      # the whole step before ever reaching the job create/update below.
      # Targets APP_BASE_URL (the custom domain when the repo variable is set)
      # rather than the raw service URL, so the job keeps working if ingress
      # is later restricted to the load balancer. Falls back to $URL.
      - name: Wire up Cloud Scheduler sanctions refresh
        continue-on-error: true
        run: |
          JOB_NAME="amlkit-sanctions-refresh"
          REFRESH_BASE="${APP_BASE_URL:-$URL}"
          if gcloud scheduler jobs describe "$JOB_NAME" --location "${{ vars.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            # 'scheduler jobs update http' does not accept 'create http''s
            # --headers flag ("unrecognized arguments... did you mean
            # '--clear-headers'?") -- it takes --update-headers instead.
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --schedule "0 */20 * * *" \
              --uri "${REFRESH_BASE}/system/refresh" \
              --http-method POST \
              --message-body "{}" \
              --update-headers "Authorization=Bearer ${SCHEDULER_SECRET}" \
              --attempt-deadline 900s \
              --max-retry-attempts 3 \
              --min-backoff 60s \
              --max-backoff 300s
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --schedule "0 */20 * * *" \
              --uri "${REFRESH_BASE}/system/refresh" \
              --http-method POST \
              --message-body "{}" \
              --headers "Authorization=Bearer ${SCHEDULER_SECRET}" \
              --attempt-deadline 900s \
              --max-retry-attempts 3 \
              --min-backoff 60s \
              --max-backoff 300s
          fi

      # UAE TFS requires a freeze within 24 hours. POST /system/check-freeze-
      # obligations emails each org's MLRO about every freeze obligation still
      # pending execution after 24h (once per obligation -- see
      # freeze_obligations.overdue_notified_at). Its only previous caller was
      # a Windows Task Scheduler script, so nothing ran it on Cloud Run.
      # Hourly, at :15 so it does not coincide with the 00:00/20:00 sanctions
      # refresh (single instance, single SQLite writer). Short call: 120s
      # attempt deadline, 3 retries 30-120s apart (Cloud Scheduler retries
      # only on non-2xx; the endpoint returns 500 on failure and is
      # idempotent, so a retry never duplicates an alert). Same bearer
      # SCHEDULER_SECRET and same continue-on-error / IAM caveats as the
      # sanctions refresh step above. A separate step so a failure of one job
      # wiring never skips the other.
      - name: Wire up Cloud Scheduler freeze obligation check
        continue-on-error: true
        run: |
          JOB_NAME="amlkit-freeze-obligations-check"
          CHECK_BASE="${APP_BASE_URL:-$URL}"
          if gcloud scheduler jobs describe "$JOB_NAME" --location "${{ vars.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            # 'update http' takes --update-headers, not create's --headers.
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --schedule "15 * * * *" \
              --uri "${CHECK_BASE}/system/check-freeze-obligations" \
              --http-method POST \
              --message-body "{}" \
              --update-headers "Authorization=Bearer ${SCHEDULER_SECRET}" \
              --attempt-deadline 120s \
              --max-retry-attempts 3 \
              --min-backoff 30s \
              --max-backoff 120s
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --schedule "15 * * * *" \
              --uri "${CHECK_BASE}/system/check-freeze-obligations" \
              --http-method POST \
              --message-body "{}" \
              --headers "Authorization=Bearer ${SCHEDULER_SECRET}" \
              --attempt-deadline 120s \
              --max-retry-attempts 3 \
              --min-backoff 30s \
              --max-backoff 120s
          fi
