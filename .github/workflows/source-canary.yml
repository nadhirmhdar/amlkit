# Upstream source canary.
#
# This workflow is NOT the 24-hour compliance control. Customer data lives on
# the compliance officer's machine and never reaches CI, so there is nothing
# here to re-screen -- see scripts/refresh.py, which is the actual control.
#
# What this does is catch upstream breakage early: a renamed dataset, a changed
# export format, a truncated file. Those failures are silent by nature -- the
# local refresh would keep reporting success against a stale copy -- so finding
# them here, on a schedule, is worth a job on its own.

name: Source canary

on:
  schedule:
    - cron: "0 5 * * *"      # daily, 05:00 UTC (09:00 Gulf Standard Time)
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 / setup-python@v6 are the first majors targeting Node 24.
      # v4/v5 target Node 20, which GitHub deprecated: the runner force-upgrades
      # them and warns on every run. Pinning the current majors keeps the
      # canary's output meaningful -- a workflow whose job is detecting silent
      # breakage must not itself be noisy, or real warnings get skimmed past.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
        # Hermetic: the suite builds its own in-memory watchlist and needs no
        # network, so a failure here is a real regression, not a flaky source.

  sources:
    name: Verify upstream sources
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 / setup-python@v6 are the first majors targeting Node 24.
      # v4/v5 target Node 20, which GitHub deprecated: the runner force-upgrades
      # them and warns on every run. Pinning the current majors keeps the
      # canary's output meaningful -- a workflow whose job is detecting silent
      # breakage must not itself be noisy, or real warnings get skimmed past.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch and parse every mandatory source
        run: |
          python - <<'PY'
          import sys
          from amlkit.db import connect
          from amlkit.ingest.base import AdapterError
          from amlkit.ingest.loader import load
          from amlkit.ingest.opensanctions import uae_local_terrorists, un_sanctions

          # Expected minimum entity counts. A source that suddenly returns far
          # fewer records has usually changed format rather than been emptied,
          # and that must fail rather than quietly shrink coverage.
          EXPECTED = {
              "ae_local_terrorists": 250,
              "un_sc_sanctions": 800,
          }

          conn = connect(":memory:")
          failed = []
          for factory in (uae_local_terrorists, un_sanctions):
              adapter = factory()
              try:
                  res = load(conn, adapter, actor="ci")
                  floor = EXPECTED.get(res.dataset, 1)
                  if res.entities < floor:
                      failed.append(
                          f"{res.dataset}: {res.entities} entities, expected >= {floor}"
                      )
                      print(f"::error::{res.dataset} returned only {res.entities} entities")
                  else:
                      print(f"OK  {res}")
              except AdapterError as exc:
                  failed.append(f"{adapter.key}: {exc}")
                  print(f"::error::{adapter.key} failed: {exc}")

          if failed:
              print("\nUPSTREAM SOURCE FAILURE:")
              for f in failed:
                  print(f"  - {f}")
              sys.exit(1)
          print("\nAll mandatory sources fetched and parsed.")
          PY

  deploy:
    name: Deploy to Cloud Run
    needs: [tests, sources]
    # workflow_dispatch alongside push: lets a manual run re-deploy master
    # on demand (e.g. to verify an IAM change like scripts/grant_scheduler_
    # iam.sh took effect) without needing a throwaway commit to trigger it.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Workload Identity Federation: GitHub's own OIDC token is exchanged
      # for short-lived GCP credentials. No service-account key ever exists
      # anywhere -- see scripts/setup_github_deploy_auth.sh for the one-time
      # GCP-side setup this depends on.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 'gcloud builds submit' was tried here first and never worked under WIF:
      # it uploads the build source through a gsutil-backed path that, per a
      # confirmed (Google "closed as not planned") upstream report, does not
      # correctly consume Workload Identity Federation credentials -- it
      # produces "The user is forbidden from accessing the bucket [..._cloudbuild]"
      # regardless of how correct the service account's IAM grants are, because
      # that upload step silently isn't using them. Three different IAM fixes
      # (objectAdmin, serviceUsageConsumer, storage.admin -- all confirmed
      # correctly applied) made no difference, which is what exposed this as a
      # client bug rather than a permissions gap. Building with Docker Buildx
      # and pushing straight to Artifact Registry avoids that upload path
      # entirely -- 'docker push' authenticates through the same WIF credential
      # via 'gcloud auth configure-docker', which is NOT affected by the bug.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build --push \
            -t "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/amlkit/amlkit:${{ github.sha }}" \
            .

      # SCHEDULER_SECRET / ADMIN_API_SECRET gate the /system/* endpoints (see
      # app.py). Reuse whatever is already deployed rather than regenerating
      # on every deploy -- `gcloud run deploy --set-env-vars` REPLACES the
      # entire env var set, so a naive redeploy would otherwise silently
      # rotate these out from under Cloud Scheduler's existing job. This step,
      # and the Cloud Scheduler wiring after deploy, port what the old manual
      # deploy scripts (removed -- they were still on a gcr.io/gcloud builds
      # submit path this CI moved off of) did by hand -- switching to this CI
      # deploy path (see the "Build and push image" step above) dropped both,
      # which is why the /system/refresh Cloud Scheduler path silently
      # stopped working: the endpoint has been returning 403 (SCHEDULER_SECRET
      # unset) on every deploy since.
      - name: Resolve scheduler/admin secrets
        run: |
          EXISTING_VARS=$(gcloud run services describe amlkit --platform managed \
            --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
            --format "value(spec.template.spec.containers[0].env)" 2>/dev/null || echo "")
          extract_existing() {
            echo "$EXISTING_VARS" | grep -oE "$1=[^,}]+" | head -1 | cut -d= -f2-
          }
          SCHEDULER_SECRET=$(extract_existing SCHEDULER_SECRET)
          [ -z "$SCHEDULER_SECRET" ] && SCHEDULER_SECRET=$(openssl rand -hex 24)
          ADMIN_API_SECRET=$(extract_existing ADMIN_API_SECRET)
          [ -z "$ADMIN_API_SECRET" ] && ADMIN_API_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$SCHEDULER_SECRET"
          echo "::add-mask::$ADMIN_API_SECRET"
          echo "SCHEDULER_SECRET=$SCHEDULER_SECRET" >> "$GITHUB_ENV"
          echo "ADMIN_API_SECRET=$ADMIN_API_SECRET" >> "$GITHUB_ENV"

      # Same shape as the old (removed) manual deploy scripts --
      # min-instances 0 to keep idle cost at $0, tagged by commit SHA so every
      # deploy is traceable to the exact commit that produced it. --timeout
      # 900: /system/refresh runs the sanctions refresh synchronously, so the
      # request needs to be allowed to run long enough.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy amlkit \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/amlkit/amlkit:${{ github.sha }}" \
            --platform managed \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --set-env-vars "GCS_BUCKET=${{ vars.GCS_BUCKET }},AMLKIT_BIND_HOST=0.0.0.0,AMLKIT_PORT=8000,AMLKIT_BEHIND_PROXY=1,SCHEDULER_SECRET=${SCHEDULER_SECRET},ADMIN_API_SECRET=${ADMIN_API_SECRET}" \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 900

      - name: Report deployed URL
        run: |
          URL=$(gcloud run services describe amlkit --platform managed --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" --format "value(status.url)")
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "Deployed: $URL"
          echo "### Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

      # Every 20 hours: safely inside the 24-hour EOCN rule with margin for a
      # slow/retried run, same reasoning as the in-process scheduler's 23-hour
      # interval (see app.py's _lifespan) but reliable across Cloud Run
      # scaling to zero, which the in-process one is not. continue-on-error:
      # the deploy service account may not (yet) hold Cloud Scheduler IAM --
      # this step's own failure must not block a deploy that otherwise
      # succeeded; it prints exactly what's missing so it's actionable
      # instead of a silent gap.
      #
      # Deliberately does NOT run 'gcloud services enable cloudscheduler
      # .googleapis.com' here: that call requires serviceusage.services.enable
      # on every single invocation, enabled or not, and this SA is
      # intentionally scoped narrowly (see setup_github_deploy_auth.sh --
      # "no access to the app's data bucket"). Granting that broad an
      # "enable any API" permission just for a one-time project setting isn't
      # worth it. Run scripts/grant_scheduler_iam.sh once instead (enables
      # the API with your own broader access, then grants only
      # roles/cloudscheduler.admin to this SA) -- also why the bash default
      # (-e) matters here: if this were left in and failed, it would abort
      # the whole step before ever reaching the job create/update below.
      - name: Wire up Cloud Scheduler sanctions refresh
        continue-on-error: true
        run: |
          JOB_NAME="amlkit-sanctions-refresh"
          if gcloud scheduler jobs describe "$JOB_NAME" --location "${{ vars.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            # 'scheduler jobs update http' does not accept 'create http''s
            # --headers flag ("unrecognized arguments... did you mean
            # '--clear-headers'?") -- it takes --update-headers instead.
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --schedule "0 */20 * * *" \
              --uri "${URL}/system/refresh" \
              --http-method POST \
              --message-body "{}" \
              --update-headers "Authorization=Bearer ${SCHEDULER_SECRET}" \
              --attempt-deadline 900s
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
              --schedule "0 */20 * * *" \
              --uri "${URL}/system/refresh" \
              --http-method POST \
              --message-body "{}" \
              --headers "Authorization=Bearer ${SCHEDULER_SECRET}" \
              --attempt-deadline 900s
          fi
