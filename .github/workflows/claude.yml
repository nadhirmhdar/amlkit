name: Claude Code

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:

  # Detailed review on every non-draft PR update — Bedrock only
  claude-detailed-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detailed Review (Bedrock)
        uses: anthropics/claude-code-action@beta
        with:
          use_bedrock: "true"
          model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
          prompt: |
            Perform a detailed code review of this pull request. Cover:
            1. Correctness of AML/screening logic (sanctions, PEP, adverse media, PF classification)
            2. Security issues (injection, auth, data exposure)
            3. Breaking changes to API or database schema
            4. Missing test coverage for compliance-critical paths
            5. Logic errors or edge cases in risk scoring
            Post findings as a PR review comment with file and line references.
            Do NOT give architectural opinions — that is handled by a separate high-level review.
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # When PR moves draft → ready, request Claude Code desktop review via comment
  notify-desktop-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request Claude Code desktop review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🔍 Ready for High-Level Review\n\nThis PR is ready. Open Claude Code desktop and run:\n\`\`\`\n/dreamon\n\`\`\`\nThen type: **review PR #${context.payload.pull_request.number}**\n\nClaude Code desktop will fetch the diff and post a high-level review using your Anthropic session — no API key required.`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-highlevel-review']
            });

  # Coding tasks triggered by @claude mention — Bedrock only
  claude-coding:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Coding Task (Bedrock)
        uses: anthropics/claude-code-action@beta
        with:
          use_bedrock: "true"
          model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
