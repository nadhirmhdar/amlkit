name: Claude Code

on:
  pull_request:
    types: [ready_for_review]

jobs:

  # When PR moves draft → ready, ping Claude Code desktop for high-level review
  notify-desktop-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Request Claude Code desktop review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🔍 Ready for High-Level Review\n\nOpen Claude Code desktop and type:\n\`\`\`\n/dreamon\n\`\`\`\nThen: **review PR #${context.payload.pull_request.number}**`
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-highlevel-review']
            });
