# Builds a signed release AAB on demand, ready to upload to Play Console.
#
# Deliberately workflow_dispatch-only, not triggered by push/tag: cutting a
# release is a decision, not something that should happen automatically
# because a commit landed. This job never talks to Play Console itself --
# see docs/google-play-steps.md for the upload step, which stays manual
# (and could be automated later with a Play publish action + a service
# account, a separate, larger trust decision from just building the AAB).
#
# Requires four repository secrets this workflow cannot set for itself --
# see docs/google-play-steps.md "Automated release builds" for exactly what
# to paste where:
#   ANDROID_KEYSTORE_BASE64    -- `base64 -w0 amlkit-upload.p12`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Android release build

on:
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: "amlkit server URL this build points at (trailing slash required)"
        required: true
      versionCode:
        description: "Integer versionCode -- must be strictly higher than the last version uploaded to Play"
        required: true
      versionName:
        description: "Human-readable version, e.g. 1.0.1"
        required: true

permissions:
  contents: read

jobs:
  bundle-release:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set -- see docs/google-play-steps.md 'Automated release builds'"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amlkit-upload.p12"

      # Same android/local.properties contract build.gradle.kts's release
      # signingConfig already reads for a local build -- this file lives
      # only in the ephemeral runner workspace, never committed, never
      # printed to the job log.
      - name: Write local signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/amlkit-upload.p12"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Build signed release bundle
        run: |
          ./gradlew bundleRelease \
            -PapiBaseUrl="${{ inputs.apiBaseUrl }}" \
            -PversionCode="${{ inputs.versionCode }}" \
            -PversionName="${{ inputs.versionName }}" \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: amlkit-release-${{ inputs.versionName }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
