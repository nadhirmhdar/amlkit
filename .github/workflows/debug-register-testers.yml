# TEMPORARY, one-off diagnostic -- not meant to stay in the repo.
#
# Retries the 3 registrations that failed with a raw HTTP 500 on the first
# pass (fawaz, vidya, shahabas -- nadhir2 and sabhiq already succeeded),
# with a short sleep between each call to rule out write contention on the
# backend's SQLite database as the cause.

name: Debug register testers (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    name: Retry 3 failed test accounts
    runs-on: ubuntu-latest
    steps:
      - name: Register accounts
        run: |
          set -e
          API="https://amlkit-g45hvblk5q-ww.a.run.app/api/v1/auth/register-organization"
          PASSWORD="AmlkitTest2026!"

          register() {
            local slug="$1"
            local display_name="$2"
            echo "== Registering ${slug}@grovisor.test =="
            HTTP_CODE=$(curl -sS -o /tmp/resp_${slug}.json -w "%{http_code}" -X POST "$API" \
              -H "Content-Type: application/json" \
              -d "{\"org_name\":\"${display_name} Test Org\",\"name\":\"${display_name}\",\"email\":\"${slug}@grovisor.test\",\"password\":\"${PASSWORD}\"}")
            echo "HTTP ${HTTP_CODE}"
            cat /tmp/resp_${slug}.json
            echo ""
            echo "---"
            sleep 5
          }

          register "fawaz" "Fawaz"
          register "vidya" "Vidya"
          register "shahabas" "Shahabas"
