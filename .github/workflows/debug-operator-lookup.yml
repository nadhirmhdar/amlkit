# TEMPORARY, one-off diagnostic -- not meant to stay in the repo.
#
# Restores the litestream replica to a scratch path (same read-only
# mechanism as backup-verify.yml, same narrowly-scoped backup-verifier SA)
# and checks a single hardcoded operator row: whether rabeeh@grovisor.test
# exists, is active, and has a password set. Deliberately does NOT select
# password_hash itself -- only whether one is present -- so no credential
# material ever lands in a CI log. Delete this file once the answer is in
# hand; it is not intended to become a standing "run arbitrary SQL against
# prod" tool.

name: Debug operator lookup (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lookup:
    name: Restore replica to scratch and look up one operator row
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_VERIFY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install litestream
        run: |
          curl -fsSL -o /tmp/litestream.deb \
            https://github.com/benbjohnson/litestream/releases/download/v0.5.16/litestream-0.5.16-linux-x86_64.deb
          sudo dpkg -i /tmp/litestream.deb

      - name: Restore replica to a scratch path
        run: |
          mkdir -p /tmp/restore-verify
          litestream restore -o /tmp/restore-verify/amlkit.db \
            "gs://${{ vars.GCS_BUCKET }}/litestream/amlkit.db"

      - name: Look up rabeeh@grovisor.test
        run: |
          sqlite3 /tmp/restore-verify/amlkit.db <<'SQL'
          .headers on
          .mode column
          SELECT id, org_id, name, email, role, is_active,
                 password_hash IS NOT NULL AS has_password,
                 failed_login_count, locked_until, created_at
          FROM operators
          WHERE lower(email) = 'rabeeh@grovisor.test';
          SQL
