name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Lint (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyflakes
      - name: Check Python syntax
        run: python -m compileall -q amlkit tests
      - name: Run pyflakes
        run: python -m pyflakes amlkit

  tests:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # The `graphviz` PyPI package (in requirements.txt) is only a thin
      # subprocess wrapper around the real `dot` binary -- tests/test_diagram.py
      # actually renders an SVG via dot.pipe(), which needs it on PATH.
      # ubuntu-latest doesn't ship it by default.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -x -q
