# Boots the real container image against a (corrupt) litestream replica and
# checks that scripts/entrypoint.sh refuses to start, in time, with a FATAL
# line -- the live dry run for the 2026-09-27 outage fix (#334).
#
# Read-only by construction: it authenticates as the backup-verifier service
# account (read-only on the data bucket, see backup-verify.yml), so even if
# the entrypoint wrongly accepted the database and went on to
# `litestream replicate`, it could not write to any replica. Nothing is
# deployed to Cloud Run and the production replica is never touched (a guard
# below refuses to point at it).
#
# Run it from the Actions tab (or the API) with `ref` set to the branch whose
# entrypoint you want to test.
#
# mode=measure-healthy answers the other half: how long the startup integrity
# check takes on the HEALTHY production database, under Cloud Run's limits.
# It restores vars.LITESTREAM_REPLICA_URL (read-only, as above) inside the
# image and times integrity_check / quick_check directly -- the entrypoint and
# `litestream replicate` are never run, so nothing can be written anywhere.
# entrypoint.sh gives each check 60s (AMLKIT_INTEGRITY_TIMEOUT); this fails
# if the healthy check needs more than half of that.

name: Entrypoint dry run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "refuse = boot against a bad replica and expect FATAL; measure-healthy = time the check on the production replica"
        required: true
        type: choice
        options: [refuse, measure-healthy]
        default: refuse
      replica_path:
        description: "refuse mode: replica to boot against, relative to the data bucket"
        required: true
        default: "quarantine-litestream-2026-09-27/litestream/amlkit.db"
      expected_status:
        description: "Space-separated FATAL statuses that count as a pass"
        required: true
        default: "corrupt unverifiable"

jobs:
  dry-run:
    name: Boot the image against the replica
    if: inputs.mode == 'refuse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_VERIFY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve and inspect the replica
        env:
          REPLICA_URL: gs://${{ vars.GCS_BUCKET }}/${{ inputs.replica_path }}
          PROD_URL: ${{ vars.LITESTREAM_REPLICA_URL }}
        run: |
          if [ -n "$PROD_URL" ] && [ "${REPLICA_URL%/}" = "${PROD_URL%/}" ]; then
            echo "::error::Refusing to dry-run against the production replica ($PROD_URL)."
            exit 1
          fi
          echo "REPLICA_URL=$REPLICA_URL" >> "$GITHUB_ENV"
          echo "Objects under $REPLICA_URL:"
          gcloud storage ls --recursive "$REPLICA_URL" | head -40 || true

      - name: Build the image from this ref
        run: docker build -t amlkit:dry-run .

      # Same limits as the Cloud Run service (--memory 1Gi --cpu 1). The
      # outer timeout is above Cloud Run's 240s startup window so an overrun
      # shows up as a failure below, not as a silently killed step.
      - name: Boot the container
        run: |
          start=$(date +%s)
          rc=0
          timeout 420 docker run --rm \
            --memory 1g --cpus 1 \
            -v "${{ steps.auth.outputs.credentials_file_path }}:/tmp/gcp-creds.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json \
            -e LITESTREAM_REPLICA_URL="$REPLICA_URL" \
            -e GCS_BUCKET="${{ vars.GCS_BUCKET }}" \
            amlkit:dry-run > /tmp/boot.log 2>&1 || rc=$?
          echo "BOOT_RC=$rc" >> "$GITHUB_ENV"
          echo "BOOT_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          cat /tmp/boot.log

      - name: Check the verdict
        env:
          EXPECTED: ${{ inputs.expected_status }}
        run: |
          echo "exit code: $BOOT_RC, boot time: ${BOOT_SECONDS}s"
          fail=0
          if [ "$BOOT_RC" = "0" ] || [ "$BOOT_RC" = "124" ] || grep -q "Starting amlkit web server" /tmp/boot.log; then
            echo "::error::The container did not refuse to start (exit $BOOT_RC)."
            fail=1
          fi
          status=$(grep -o 'status: [a-z_]*' /tmp/boot.log | tail -1 | cut -d' ' -f2)
          if [ -z "$status" ]; then
            echo "::error::No FATAL status line in the boot log."
            fail=1
          elif ! echo " $EXPECTED " | grep -q " $status "; then
            echo "::error::Refused with status '$status', expected one of: $EXPECTED."
            fail=1
          fi
          if [ "$BOOT_SECONDS" -ge 240 ]; then
            echo "::error::Took ${BOOT_SECONDS}s -- over Cloud Run's 240s startup window."
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "PASS: refused to start with status '$status' after ${BOOT_SECONDS}s."
            {
              echo "### Entrypoint dry run: PASS"
              echo "Replica: \`$REPLICA_URL\`  "
              echo "Refused with status **$status** after **${BOOT_SECONDS}s** (exit $BOOT_RC)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $fail

  measure-healthy:
    name: Time the integrity check on the production replica
    if: inputs.mode == 'measure-healthy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_VERIFY_SA }}

      - name: Build the image from this ref
        run: docker build -t amlkit:measure .

      # Same limits as Cloud Run. Each check gets 300s here so a slow one is
      # measured rather than cut off at the entrypoint's 60s.
      - name: Restore and time the checks
        env:
          REPLICA_URL: ${{ vars.LITESTREAM_REPLICA_URL }}
        run: |
          set -o pipefail
          if [ -z "$REPLICA_URL" ]; then
            echo "::error::Repo variable LITESTREAM_REPLICA_URL is not set."
            exit 1
          fi
          docker run --rm --memory 1g --cpus 1 \
            -v "${{ steps.auth.outputs.credentials_file_path }}:/tmp/gcp-creds.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json \
            -e REPLICA_URL="$REPLICA_URL" \
            --entrypoint sh amlkit:measure -c '
              set -e
              # Production is replicating while this reads, so litestream can
              # delete an LTX file the restore already listed. Retry, and
              # report how many attempts it took: that is the same race a
              # new revision of a deploy runs against the old one.
              n=1
              while :; do
                t0=$(date +%s)
                if litestream restore -o /tmp/m.db "$REPLICA_URL"; then break; fi
                echo "restore attempt $n failed after $(( $(date +%s) - t0 ))s"
                [ "$n" -ge 6 ] && { echo "restore_attempts=$n (all failed)"; exit 1; }
                rm -f /tmp/m.db /tmp/m.db-wal /tmp/m.db-shm
                n=$((n + 1)); sleep 5
              done
              echo "restore_attempts=$n"
              echo "restore_seconds=$(( $(date +%s) - t0 ))"
              echo "db_bytes=$(stat -c %s /tmp/m.db)"
              for p in integrity_check quick_check; do
                s=$(date +%s); rc=0
                out=$(timeout -k 10s 300s sqlite3 /tmp/m.db "PRAGMA $p" 2>&1) || rc=$?
                echo "${p}_seconds=$(( $(date +%s) - s ))"
                echo "${p}_exit=$rc"
                echo "${p}_result=$(echo "$out" | head -1)"
              done
            ' | tee /tmp/measure.txt

      - name: Check the budget
        run: |
          get() { sed -n "s/^$1=//p" /tmp/measure.txt | head -1; }
          restore=$(get restore_seconds); bytes=$(get db_bytes)
          ic=$(get integrity_check_seconds); ic_rc=$(get integrity_check_exit); ic_res=$(get integrity_check_result)
          qc=$(get quick_check_seconds); qc_res=$(get quick_check_result)
          {
            echo "### Healthy startup check on the production replica"
            echo "| | |"
            echo "|---|---|"
            echo "| Database size | $(( ${bytes:-0} / 1048576 )) MiB |"
            echo "| litestream restore | ${restore}s (attempt $(get restore_attempts)) |"
            echo "| integrity_check | ${ic}s (exit ${ic_rc}, \`${ic_res}\`) |"
            echo "| quick_check | ${qc}s (\`${qc_res}\`) |"
            echo "| Entrypoint budget per check | 60s |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$ic_rc" != "0" ] || [ "$ic_res" != "ok" ]; then
            echo "::error::The production replica did not pass integrity_check (exit $ic_rc: $ic_res)."
            exit 1
          fi
          if [ "$ic" -ge 30 ]; then
            echo "::error::integrity_check took ${ic}s -- over half the 60s entrypoint budget; raise AMLKIT_INTEGRITY_TIMEOUT before relying on it."
            exit 1
          fi
          echo "PASS: healthy integrity_check ${ic}s, restore ${restore}s, total ~$(( restore + ic ))s of Cloud Run's 240s."

