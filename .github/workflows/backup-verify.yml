# Verifies the litestream replica actually restores cleanly.
#
# The Aug 19 outage's corrupted segment ("decode page 7575: EOF") was only
# discovered because it took production down -- nothing had ever exercised
# `litestream restore` against the real replica outside that one incident.
# This runs the same restore CI could run in an emergency, on a schedule,
# against a scratch path, and fails loudly the moment the replica stops
# restoring to a database that passes SQLite's own integrity check -- so a
# bad replica is caught here, not during the next real recovery.
#
# Needs its own, narrowly-scoped service account: the existing CI deploy SA
# (github-deployer, see setup_github_deploy_auth.sh) deliberately has no
# access to the app's data bucket. Run scripts/grant_backup_verify_iam.sh
# once to create backup-verifier@... with read-only access to just this one
# bucket, and set GCP_BACKUP_VERIFY_SA to its email -- until that's done,
# this workflow's auth step fails loudly rather than silently skipping.

name: Backup restore verification

on:
  schedule:
    - cron: "0 7 * * *"      # daily, 07:00 UTC -- after source-canary's 05:00 deploy
  workflow_dispatch:
    inputs:
      restore_point:
        description: "Optional point to restore to instead of the latest: an RFC3339 timestamp (2026-10-03T19:50:00Z) or a TXID. Use it to find the last good point after a decode error at the head of the replica."
        required: false
        default: ""

jobs:
  verify-restore:
    name: Restore litestream replica to scratch and check integrity
    runs-on: ubuntu-latest
    # Backstop for the same defect entrypoint.sh's PR #334 fixed: an
    # untimed `PRAGMA integrity_check` against a corrupted replica can hang
    # rather than fail. The per-step `timeout` below turns that into a fast,
    # clearly-labeled failure; this job-level timeout is a second net in
    # case *any* step (including `litestream restore` itself) wedges,
    # instead of the default 360-minute GitHub Actions job timeout -- which
    # would silently burn CI minutes for up to 6 hours on a job whose whole
    # point is to fail loudly and quickly when the replica is bad.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Same Workload Identity Federation pool as the deploy workflow (see
      # setup_github_deploy_auth.sh) -- one pool, multiple narrowly-scoped
      # service accounts, each with their own roles/iam.workloadIdentityUser
      # binding to it. No service-account key ever exists anywhere.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_VERIFY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Pinned to the exact version production runs (see Dockerfile) --
      # a restore verified against a different litestream build than the
      # one actually writing the replica isn't verifying the real path.
      - name: Install litestream
        run: |
          curl -fsSL -o /tmp/litestream.deb \
            https://github.com/benbjohnson/litestream/releases/download/v0.5.16/litestream-0.5.16-linux-x86_64.deb
          sudo dpkg -i /tmp/litestream.deb

      # No -config / litestream.yml needed -- litestream restore accepts a
      # replica URL directly as its positional argument. Deliberately no
      # -if-replica-exists: unlike entrypoint.sh's first-boot case, a
      # missing replica here IS the failure this job exists to catch, not a
      # benign state to pass through.
      # Same repo variable the deploy passes to the app (#350), so this checks
      # the replica production actually writes -- not the litestream/ prefix
      # abandoned as corrupt on 2026-09-27. No fallback: verifying the wrong
      # replica would report a healthy backup that isn't the real one.
      - name: Restore replica to a scratch path
        env:
          REPLICA_URL: ${{ vars.LITESTREAM_REPLICA_URL }}
          RESTORE_POINT: ${{ inputs.restore_point }}
        run: |
          if [ -z "$REPLICA_URL" ]; then
            echo "::error::Repo variable LITESTREAM_REPLICA_URL is not set -- cannot tell which replica production writes."
            exit 1
          fi
          mkdir -p /tmp/restore-verify
          POINT_ARGS=""
          if [ -n "$RESTORE_POINT" ]; then
            case "$RESTORE_POINT" in
              *T*) POINT_ARGS="-timestamp $RESTORE_POINT" ;;
              *)   POINT_ARGS="-txid $RESTORE_POINT" ;;
            esac
            echo "Restoring to $RESTORE_POINT ($POINT_ARGS), not the latest position."
          fi
          # The plan (which snapshot, how many LTX files) is what decides the
          # restore time, so print it first; it is also what shows where a
          # decode error sits. `|| true`: the plan is informational.
          plan=$(litestream restore -dry-run $POINT_ARGS -o /tmp/restore-verify/amlkit.db "$REPLICA_URL" 2>&1) || true
          echo "Restore plan ($(printf '%s\n' "$plan" | wc -l) lines):"
          printf '%s\n' "$plan" | head -n 12
          echo "..."
          printf '%s\n' "$plan" | tail -n 6
          started=$(date +%s)
          litestream restore $POINT_ARGS -o /tmp/restore-verify/amlkit.db "$REPLICA_URL"
          SECONDS_TAKEN=$(( $(date +%s) - started ))
          echo "litestream restore took ${SECONDS_TAKEN}s"
          echo "RESTORE_SECONDS=$SECONDS_TAKEN" >> "$GITHUB_ENV"

      # The restore replays every LTX file since the last snapshot, so its
      # duration is the leading indicator for the cold-start outage of
      # 2026-10-04: it had climbed from ~2 min (30 Sep) to 9.4 min (3 Oct)
      # here while nothing re-snapshotted the replica, until a Cloud Run cold
      # start no longer fit the startup probe. Fail loudly well before that.
      # GitHub's runners are in another region, so this takes longer than the
      # service's own restore; the thresholds are relative to the trend here.
      - name: Check restore duration
        run: |
          echo "restore: ${RESTORE_SECONDS}s"
          if [ "$RESTORE_SECONDS" -ge 300 ]; then
            echo "::error::litestream restore took ${RESTORE_SECONDS}s (limit 300s). The replay since the last snapshot has grown too large for a Cloud Run cold start -- check that litestream is snapshotting (litestream.yml snapshot.interval, and that an instance stays up that long)."
            exit 1
          fi
          if [ "$RESTORE_SECONDS" -ge 150 ]; then
            echo "::warning::litestream restore took ${RESTORE_SECONDS}s (warning at 150s, failure at 300s)."
          fi

      - name: Check restored database integrity
        run: |
          # `|| CODE=$?`: bash's `set -e` (GH Actions' default for `run:`
          # steps) kills the step at a bare `VAR=$(cmd)` assignment if the
          # substitution fails -- same gotcha entrypoint.sh's PR #334 hit --
          # so guard it the same way, rather than let a timeout abort this
          # script before the clear "::error::" message below can print.
          CODE=0
          RESULT=$(timeout -k 10s 60s sqlite3 /tmp/restore-verify/amlkit.db "PRAGMA integrity_check;") || CODE=$?
          echo "PRAGMA integrity_check: $RESULT"
          if [ $CODE -eq 124 ] || [ $CODE -eq 137 ]; then
            echo "::error::integrity_check timed out after 60s against the restored replica -- treat as failed, not benign: a healthy check should return in well under that."
            exit 1
          fi
          if [ "$RESULT" != "ok" ]; then
            echo "::error::Restored replica failed integrity_check: $RESULT"
            exit 1
          fi
          COUNT=$(sqlite3 /tmp/restore-verify/amlkit.db "SELECT COUNT(*) FROM organizations;")
          echo "organizations in restored replica: $COUNT"
