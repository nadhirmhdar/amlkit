dbs:
  - path: /app/data/amlkit.db
    # Singular `replica:`, not a `replicas:` list -- this is the exact
    # schema shipped in litestream's own etc/litestream.yml template for
    # this release (v0.5.16). The plural `replicas:` key shown in some of
    # litestream's own docs does NOT read `url:` in this build -- it still
    # expects the older `type:` field and fails with "unknown replica type
    # in config: ''" when `url:` is given instead. Verified by actually
    # deploying both forms, not assumed from docs alone.
    replica:
      url: gcs://${GCS_BUCKET}/litestream/amlkit.db
