dbs:
  - path: /app/data/amlkit.db
    replicas:
      # litestream 0.5.x uses a scheme-prefixed url, not the older
      # type/bucket/path triplet (that syntax is no longer recognized --
      # "unknown replica type in config: gcs" is what it fails with).
      # GCS auth is via Application Default Credentials -- Cloud Run's
      # attached service account, no separate key needed.
      - url: gcs://${GCS_BUCKET}/litestream/amlkit.db
