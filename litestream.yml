dbs:
  - path: /app/data/amlkit.db
    # Singular `replica:` (ReplicaConfig.URL/.Type -- cmd/litestream/main.go
    # in the v0.5.16 tag), not a `replicas:` list -- that key still exists
    # (deprecated) but wasn't reliably parsed in testing here.
    #
    # Scheme is `gs://`, not `gcs://`. litestream's own PROVIDER_COMPATIBILITY.md
    # documents `gcs://`, but the actual v0.5.16 binary's replica-type switch
    # (NewReplicaFromConfig in cmd/litestream/main.go) only registers "gs" --
    # "gcs" falls through to its default case and fails as an unknown type.
    # Confirmed by reading that switch statement directly, not by guessing
    # again after three failed deploys.
    #
    # Bucket URL now templated via ${LITESTREAM_REPLICA_URL} — entrypoint.sh
    # runs envsubst to substitute it before litestream sees this file.
    replica:
      url: ${LITESTREAM_REPLICA_URL}
